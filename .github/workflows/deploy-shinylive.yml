# Automatically builds and deploys the Titra Shiny web app to GitHub Pages via Shinylive (WebR).
# One-time setup on GitHub: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy Titra Shiny Web App (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install system libraries and shinylive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libarchive-dev libcurl4-openssl-dev libssl-dev libxml2-dev
          Rscript -e 'install.packages(c("shinylive", "jsonlite", "base64enc", "htmltools", "shiny")); stopifnot(requireNamespace("shinylive", quietly = TRUE), requireNamespace("shiny", quietly = TRUE))'
      - name: Export Shinylive static site
        run: |
          rm -rf _app site
          mkdir -p _app
          cp -r app.R nr_report.typ R www _app/
          Rscript -e '
            shinylive::export(appdir = "_app", destdir = "site")
            file.copy("www/favicon.svg", "site/favicon.svg", overwrite = TRUE)
            idx <- file.path("site", "index.html")
            if (file.exists(idx)) {
              h <- paste(readLines(idx, warn = FALSE), collapse = "\n")
              h <- sub("<title>.*?</title>", "<title>Titra — DBS Programming Studio</title>", h)
              h <- sub("</head>", "<link rel=\"icon\" type=\"image/svg+xml\" href=\"./favicon.svg\" />\n<meta name=\"theme-color\" content=\"#B81D33\" />\n</head>", h, fixed = TRUE)
              writeLines(h, idx, useBytes = TRUE)
            }
            file.create("site/.nojekyll")
          '
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
