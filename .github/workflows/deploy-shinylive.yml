# Automatically builds and deploys the Titra Shiny web app to GitHub Pages via Shinylive (WebR).
# One-time setup on GitHub: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy Titra Shiny Web App (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Install shinylive
        shell: Rscript {0}
        run: |
          install.packages(c("shinylive", "jsonlite", "base64enc", "htmltools", "shiny"),
                           repos = "https://cloud.r-project.org")
      - name: Export Shinylive static site
        shell: Rscript {0}
        run: |
          shinylive::export(appdir = ".", destdir = "site")
          file.copy("www/favicon.svg", "site/favicon.svg", overwrite = TRUE)
          idx <- file.path("site", "index.html")
          if (file.exists(idx)) {
            h <- paste(readLines(idx, warn = FALSE), collapse = "\n")
            h <- sub("<title>.*?</title>", "<title>Titra — DBS Programming Studio</title>", h)
            h <- sub("</head>", "<link rel=\"icon\" type=\"image/svg+xml\" href=\"./favicon.svg\" />\n<meta name=\"theme-color\" content=\"#B81D33\" />\n</head>", h, fixed = TRUE)
            writeLines(h, idx, useBytes = TRUE)
          }
          file.create("site/.nojekyll")
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
